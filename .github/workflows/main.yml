name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          mkdir -p project
          unzip -o beintv-tv-project.zip -d project

      - name: إعداد Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK
        working-directory: project/android
        run: gradle assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path:project/android/**/build/outputs/apk/**/*.apk
