name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: فك ضغط المشروع
        run: |
          mkdir -p project
          unzip -o beintv-tv-project.zip -d project
          echo "محتويات المشروع:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: إعداد Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: البحث عن مشروع Android
        shell: bash
        run: |
          ANDROID_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "لم يتم العثور على settings.gradle"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "تم العثور على مشروع Android في: $ANDROID_DIR"

      - name: بناء APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          gradle assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ env.ANDROID_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
